<svg
  width="64"
  height="64"
  viewBox="0 0 64 64"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Banda exterior -->
  <circle
    cx="32"
    cy="32"
    r="24"
    fill="none"
    stroke="#1F4E79"
    stroke-width="4"
  />

  <!-- Banda media más fina y más compacta -->
  <circle
    cx="32"
    cy="32"
    r="19.5"
    fill="none"
    stroke="#4F81BD"
    stroke-width="2.2"
  />

  <!-- Banda interior más fina y más compacta -->
  <circle
    cx="32"
    cy="32"
    r="15.5"
    fill="none"
    stroke="#B3B3B3"
    stroke-width="2"
  />

  <!-- Texto centrado -->
  <text
    x="32"
    y="36"
    font-family="Arial, sans-serif"
    font-size="8.5"
    text-anchor="middle"
    fill="#1F4E79"
    font-weight="bold"
    letter-spacing="0.4"
  >
    CGL
  </text>
</svg>